<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>Camera Capture Screen</title>

                    "borderRadius": {
                        "DEFAULT": "1rem",

                    "spacing": {
                        "gutter": "16px",
                        "sm": "8px",
                        "xs": "4px",
                        "lg": "24px",
                        "unit": "8px",

                        "body-md": ["Roboto Flex"],

<style>
        body { font-family: 'Roboto Flex', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        /* Hide scrollbar for clean horizontal scrolling */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface dark:bg-surface text-on-surface dark:text-on-surface min-h-screen p-lg flex flex-col items-center justify-start gap-xl">
<div class="text-center">
<h1 class="font-headline-lg text-headline-lg mb-sm">Camera Capture Flows</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Live Preview and Captured States</p>
</div>
<!-- Container for Frames -->
<div class="flex flex-wrap justify-center gap-xl">
<!-- Frame 1: Live Preview -->
<div class="flex flex-col items-center gap-sm">
<span class="font-title-md text-title-md text-on-surface-variant">Live Preview (Dark)</span>
<div class="relative w-[360px] h-[800px] rounded-xl overflow-hidden bg-black shadow-2xl flex flex-col justify-between">
<!-- Camera Feed Placeholder -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-80" data-alt="A detailed view of a bustling city street scene taken from a slightly elevated perspective, showcasing modern architecture, glowing streetlights, and blurred movement of vehicles, evoking a vibrant, energetic mood in a dark, atmospheric setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBK-paVK4NTzEUssGFqZp9flrFGRl7SFB_FugIYQs8FKUi3wFHUwJHnq7GzRYlQhnR3byBRoDnBrNYuTqM0BRi0oQeq-S-FGGtaSN167TepJFdbQuLeidek9LQKqPyLIAs6w1iYjT73UBvNX28D6Fc79YdXrzKIUPKBjKzHGnc80AF0nsXMxivVKz44ZDHdH1dfo9WuO8w9mU8q_1MZG0stBOhqyykqa9PZrFqQPdnqsccjRBop5s7eNP0JEuAUuIEl3hoKO36fa9C3"/>
</div>
<!-- Top App Bar Area (Overlay) -->
<div class="relative z-10 flex items-center justify-between px-md py-sm w-full h-16 bg-gradient-to-b from-black/50 to-transparent">
<button class="w-12 h-12 flex items-center justify-center rounded-full text-white hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-full text-white hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined" data-icon="flash_off">flash_off</span>
</button>
</div>
<!-- Bottom Controls Area -->
<div class="relative z-10 w-full flex flex-col items-center pb-xl bg-gradient-to-t from-black/80 via-black/40 to-transparent pt-xl">
<!-- Filter Chips (Scrollable) -->
<div class="w-full overflow-x-auto hide-scrollbar px-md mb-lg">
<div class="flex gap-sm">
<button class="px-md py-xs rounded-lg bg-primary-container text-on-primary-container font-label-lg text-label-lg whitespace-nowrap border border-primary-container">Identify</button>
<button class="px-md py-xs rounded-lg bg-transparent text-white border border-outline-variant font-label-lg text-label-lg whitespace-nowrap hover:bg-white/10 transition-colors">Read</button>
<button class="px-md py-xs rounded-lg bg-transparent text-white border border-outline-variant font-label-lg text-label-lg whitespace-nowrap hover:bg-white/10 transition-colors">Translate</button>
<button class="px-md py-xs rounded-lg bg-transparent text-white border border-outline-variant font-label-lg text-label-lg whitespace-nowrap hover:bg-white/10 transition-colors">Summarize</button>
</div>
</div>
<!-- Shutter Button -->
<div class="flex items-center justify-center gap-xl w-full px-xl">
<button class="w-12 h-12 flex items-center justify-center rounded-full text-white bg-surface-container-highest/20 hover:bg-surface-container-highest/40 backdrop-blur-sm transition-colors">
<span class="material-symbols-outlined" data-icon="photo_library">photo_library</span>
</button>
<button class="w-20 h-20 rounded-full border-4 border-white flex items-center justify-center p-1 active:scale-95 transition-transform">
<div class="w-full h-full bg-white rounded-full"></div>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-full text-white bg-surface-container-highest/20 hover:bg-surface-container-highest/40 backdrop-blur-sm transition-colors">
<span class="material-symbols-outlined" data-icon="flip_camera_ios">flip_camera_ios</span>
</button>
</div>
</div>
</div>
</div>
<!-- Frame 2: Captured State -->
<div class="flex flex-col items-center gap-sm">
<span class="font-title-md text-title-md text-on-surface-variant">Captured State (Dark)</span>
<div class="relative w-[360px] h-[800px] rounded-xl overflow-hidden bg-black shadow-2xl flex flex-col justify-between">
<!-- Captured Image Placeholder (Blurred/Frozen effect) -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover" data-alt="A sharp, detailed photograph of a beautiful, intricate succulent plant sitting in a minimalist ceramic pot on a wooden desk, softly illuminated by natural window light, creating a calm, grounded, and modern aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBujbpHR0200a2OH4aemSV_1z9bgWA9-b6R8qf3_VpMiMhlpFmK4cpK3iWGxaCEgtiOtKNW5mEo_HX5GgEJnH7Tf4l-epzIlnCohlczpOP3KQTNtyzvw_mezXBY2ZrY38qt2JqlbSmGw2VCJi0GIisxFffcIRpC2fU4nOr-cIcDDr6K3g1s-NnKJbIGuw7Zx5FdBMVkmTLGrBCmIWGTp1EmaEjs63ZjJOhATh4vXhmsxngJ9bCeJD6SPKWzDON5iDeMBTk5H8vM7h_-"/>
<!-- Slight dark overlay to make UI pop -->
<div class="absolute inset-0 bg-black/20"></div>
</div>
<!-- Top App Bar Area (Overlay) -->
<div class="relative z-10 flex items-center justify-between px-md py-sm w-full h-16 bg-gradient-to-b from-black/50 to-transparent">
<button class="w-12 h-12 flex items-center justify-center rounded-full text-white hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<!-- Small indicator of context -->
<div class="bg-surface-container-highest/30 backdrop-blur-md px-sm py-xs rounded-full flex items-center gap-xs">
<span class="material-symbols-outlined text-white text-[16px]" data-icon="lock">lock</span>
<span class="font-label-sm text-label-sm text-white">On-device</span>
</div>
</div>
<!-- Bottom Action Area -->
<div class="relative z-10 w-full flex flex-col bg-surface-container-high rounded-t-xl p-md gap-md shadow-[0_-8px_24px_rgba(0,0,0,0.3)]">
<!-- Input Field -->
<div class="w-full flex items-center bg-surface-container-lowest rounded-full px-md py-sm border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant mr-sm" data-icon="search">search</span>
<input class="bg-transparent border-none outline-none flex-grow font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant focus:ring-0" placeholder="Ask about this..." type="text"/>
<button class="w-8 h-8 flex items-center justify-center rounded-full bg-primary text-on-primary">
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_upward">arrow_upward</span>
</button>
</div>
<!-- Actions -->
<div class="flex w-full gap-sm">
<button class="flex-1 py-sm rounded-lg border border-outline-variant font-label-lg text-label-lg text-on-surface hover:bg-surface-container-highest transition-colors flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[20px]" data-icon="replay">replay</span>
                            Retake
                        </button>
<button class="flex-1 py-sm rounded-lg bg-primary text-on-primary font-label-lg text-label-lg hover:bg-primary-container hover:text-on-primary-container transition-colors flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[20px]" data-icon="check">check</span>
                            Use
                        </button>
</div>
</div>
</div>
</div>
</div>
</body></html>
